// Headless executor (Phase 1) + jMonkeyEngine renderer (Phase 2, per R2's engine decision).
plugins {
    id 'application'
}

dependencies {
    implementation project(':core-sdk-mock')
    implementation project(':physics-engine')

    def jme3 = [v: '3.7.0-stable', g: 'org.jmonkeyengine']
    implementation "${jme3.g}:jme3-core:${jme3.v}"
    implementation "${jme3.g}:jme3-desktop:${jme3.v}"
    runtimeOnly "${jme3.g}:jme3-lwjgl3:${jme3.v}"

    // Phase 4: Libbulletjme-backed rigid-body physics via Minie (per R2's engine decision).
    // Minie bundles Libbulletjme's native code (incl. V-HACD) directly, so no separate
    // Libbulletjme dependency is needed.
    implementation 'com.github.stephengold:Minie:9.0.3'
    testImplementation "${jme3.g}:jme3-desktop:${jme3.v}"
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test { useJUnitPlatform() }

application {
    mainClass = 'simrunner.Main'
}

tasks.named('run', JavaExec) {
    workingDir = rootProject.projectDir
}

tasks.register('runSimulatorApp', JavaExec) {
    group = 'application'
    description = 'Launches the 3D jME simulator window.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'simrunner.SimulatorApp'
    workingDir = rootProject.projectDir
    // GLFW/AWT on macOS require windowing calls on the process's first thread.
    jvmArgs = ['-XstartOnFirstThread', '-Djava.awt.headless=true']
    maxHeapSize = '2g'
}

tasks.register('selectField', JavaExec) {
    group = 'application'
    description = 'Select or import a field, choose pieces, preview and run the current robot.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'simrunner.FieldLauncher'
    workingDir = rootProject.projectDir
}

